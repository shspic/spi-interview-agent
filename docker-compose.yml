name: spi-local-production

x-backend-environment: &backend-environment
  APP_ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://spi_app:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@postgres:5432/spi_app
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
  AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:?请设置 AUTH_CSRF_SECRET}
  REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:?请设置 REGISTRATION_INVITE_CODE}
  RATE_LIMIT_HASH_SALT: ${RATE_LIMIT_HASH_SALT:?请设置 RATE_LIMIT_HASH_SALT}
  AUTH_COOKIE_SECURE: "false"
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  UPLOAD_DIR: /app/data/uploads
  CHROMA_PERSIST_DIR: /app/data/chroma_db
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

x-backend-volumes: &backend-volumes
  - uploads:/app/data/uploads
  - chroma:/app/data/chroma_db
  - backups:/app/backups

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spi_app
      POSTGRES_USER: spi_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi_app -d spi_app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker_health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  uploads:
  chroma:
  backups:
